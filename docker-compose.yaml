version: "3.8"
services:
  db:
    image: postgres:16
    container_name: postgres_container
    env_file:
      - ./.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # opcional: healthcheck para garantir readiness antes da app iniciar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milim"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  db_data:

[package]
name = "app"
edition = "2021"
version = "0.1.0"


[dependencies]
# ===== wasm =====
log = "0.4"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
yew = { version = "0.21" }
yew-router = "0.18"
yew-hooks = "0.3"
# ===== wasm =====
serde_json = { version = "1.0.142", optional = true }
chrono = "0.4.41"
dotenv = { version = "0.15.0", optional = true }
jsonwebtoken = { version = "9.3.1", optional = true }
rand = { version = "0.9.2", optional = true }
rand_core = { version = "0.9.3", optional = true }
rust-argon2 = { version = "3.0.0", optional = true }
rocket = { version = "0.5.1", features = [
    "json",
    "uuid",
    "serde_json",
], optional = true }
sqlx = { version = "0.8.6", features = [
    "runtime-async-std-native-tls",
    "postgres",
    "chrono",
    "uuid",
], optional = true }


[features]
default = ["ssr"]
csr = ["yew/csr"]
ssr = ["yew/ssr", "rocket", "sqlx", "rand", "rand_core", "rust-argon2"]
hydration = ["yew/hydration"]
